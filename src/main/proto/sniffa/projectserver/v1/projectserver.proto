syntax = "proto3";

package sniffa.projectserver.v1;

option java_multiple_files = true;
option java_package = "studio.sniffa.common.projectserver.grpc.v1";
option java_outer_classname = "ProjectServerProto";

// Consumed by sniffa-node-agent: what should be running on this node, and reporting back what
// actually happened. Reconciliation-loop shape - see sniffa-docs'
// project-server-orchestrator-design.md for the full picture.
service ProjectAgentService {
  rpc DiscoverServers (DiscoverServersRequest) returns (DiscoverServersResponse);
  rpc ReportStatus (ReportStatusRequest) returns (ReportStatusResponse);
  // "I'm alive, here's how many servers I'm running" - lets the dashboard show real node status
  // instead of a free-text field nobody can verify. Called every tick, same cadence as
  // DiscoverServers.
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  // The dashboard never talks to a node-agent directly (it may not be reachable from the
  // backend's network) - it enqueues an AgentCommand on sniffa-backend, the agent polls for its
  // own node's pending commands on the same cadence as DiscoverServers and reports the result
  // back via CompleteCommand. Same "poll, don't get pushed to" shape as the rest of this service.
  rpc ListPendingCommands (ListPendingCommandsRequest) returns (ListPendingCommandsResponse);
  rpc CompleteCommand (CompleteCommandRequest) returns (CompleteCommandResponse);
}

// Consumed by sniffa-proxy (Velocity plugin): which servers exist to register dynamically, and
// who's allowed onto a given client project's server.
service ProjectProxyService {
  rpc ListServers (ListServersRequest) returns (ListServersResponse);
  rpc GetAccess (GetAccessRequest) returns (GetAccessResponse);
}

enum DesiredState {
  DESIRED_STATE_UNSPECIFIED = 0;
  DESIRED_STATE_RUNNING = 1;
  DESIRED_STATE_STOPPED = 2;
}

enum ServerState {
  SERVER_STATE_UNSPECIFIED = 0;
  SERVER_STATE_RUNNING = 1;
  SERVER_STATE_STOPPED = 2;
  SERVER_STATE_FAILED = 3;
}

enum AgentCommandType {
  AGENT_COMMAND_TYPE_UNSPECIFIED = 0;
  // `docker logs --tail N <container>` - the last chunk of console output.
  AGENT_COMMAND_TYPE_CONSOLE_TAIL = 1;
  // Arbitrary RCON command, e.g. "say hi" or "whitelist add Notch" - see command_text.
  AGENT_COMMAND_TYPE_EXECUTE = 2;
  // `docker stats --no-stream` plus an RCON "list" for player count.
  AGENT_COMMAND_TYPE_STATS = 3;
}

message DiscoverServersRequest {
  string node_id = 1;
}

message ProjectServer {
  string id = 1;
  string client_project_id = 2;
  string image = 3;
  DesiredState desired_state = 4;
  int32 port = 5;
  string container_name = 6;
  // RCON, for a graceful drain (warning + wait) before the agent stops the container instead of
  // killing it outright. 0/empty means RCON isn't configured for this server - the agent falls
  // back to an immediate stop, same as before this field existed.
  int32 rcon_port = 7;
  string rcon_password = 8;
  // itzg/docker-minecraft-server's TYPE env value (e.g. "PAPER", "VANILLA") for game servers, or
  // itzg/mc-proxy's TYPE value (e.g. "VELOCITY") for proxies - see ProjectServer.SoftwareType in
  // sniffa-backend, the source of truth for the enum/image mapping. The agent just sets env vars,
  // it never decides which image or type a server runs.
  string server_type = 9;
  string version = 10;
  bool proxy = 11;
}

message DiscoverServersResponse {
  repeated ProjectServer servers = 1;
}

message ReportStatusRequest {
  string server_id = 1;
  ServerState state = 2;
  string message = 3;
}

message ReportStatusResponse {
}

message ListServersRequest {
}

message ProxyServer {
  string id = 1;
  string name = 2;
  string host = 3;
  int32 port = 4;
  ServerState state = 5;
  // Needed by sniffa-proxy's AccessGate to look up who's allowed on this specific server via
  // GetAccess - empty for the lobby, which has no access restriction.
  string client_project_id = 6;
}

message ListServersResponse {
  repeated ProxyServer servers = 1;
}

message HeartbeatRequest {
  string node_id = 1;
  int32 server_count = 2;
}

message HeartbeatResponse {
}

message ListPendingCommandsRequest {
  string node_id = 1;
}

message AgentCommand {
  string id = 1;
  string server_id = 2;
  AgentCommandType type = 3;
  // Only set for AGENT_COMMAND_TYPE_EXECUTE - the RCON command text to send.
  string command_text = 4;
}

message ListPendingCommandsResponse {
  repeated AgentCommand commands = 1;
}

message ServerStats {
  double cpu_percent = 1;
  int64 memory_used_mb = 2;
  int64 memory_limit_mb = 3;
  int32 players_online = 4;
  int32 players_max = 5;
}

message CompleteCommandRequest {
  string command_id = 1;
  bool success = 2;
  // Console lines or RCON response text - set for CONSOLE_TAIL/EXECUTE, empty for STATS (see stats below).
  string result = 3;
  // Only set for AGENT_COMMAND_TYPE_STATS.
  ServerStats stats = 4;
}

message CompleteCommandResponse {
}

message GetAccessRequest {
  string client_project_id = 1;
}

// Minecraft usernames, not Discord IDs: Velocity only ever sees a connecting player's Minecraft
// identity, never their Discord account, so that's what actually needs to be checkable at the
// proxy - same "resolve to IGN before enforcement" pattern marguhl-gameshow's whitelist sync
// already uses. discordUserId still exists on ProjectAccessEntry server-side (that's who staff
// granted access to), it's just not what this RPC needs to hand back.
message GetAccessResponse {
  repeated string mc_usernames = 1;
}
